<style>
        .glass-card {
            background: rgba(238, 232, 213, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(101, 123, 131, 0.2);
        }
        .solarized-input {
            background-color: #eee8d5;
            border: 1px solid rgba(101, 123, 131, 0.2);
        }
        .solarized-input:focus {
            border-color: #268bd2;
            border-width: 2px;
            outline: none;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Suppress Navigation Shells (TopNav/SideNav) because this is a transactional Login page -->
<main class="w-full max-w-md">
<!-- Logo / Seal Area -->
<div class="flex flex-col items-center mb-8">
<div class="w-24 h-24 mb-4 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center overflow-hidden">
<!-- Using a placeholder image for the seal with data-alt -->
<img alt="Government Seal" class="w-full h-full object-cover" data-alt="A highly detailed illustration of a fictional, dignified government seal or emblem in a minimalist style. The emblem features subtle geometric patterns and classical motifs representing authority and trust. Designed to match a light mode interface with warm parchment tones (#fdf6e3) and muted blue accents (#268bd2). The lines are clean, crisp, and authoritative, echoing traditional bureaucratic heraldry updated for modern digital interfaces." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYOqJJQ5y318MfcpMI8msPsXIjDQuDbj3EewP0ngyjWOhD0Om84i3_OPgkOYxwwkXPCr0WZpjS3ZuMafuRiN6UQbySg3NfA46q2-unh4uFKRNPRzQ5IKyQzstieZbib4cKjf6wPd3cEWTRpdxIJLAsmCuFGp7N3h7lNsGvq-GNSjoAGsl8Nd0eRBJiLVC6De06Ve3Noh-JFNzRFbMV6kNl2oHjPbFPkXOCSgHTX6NvDvFL2N9YOJDzmQ"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary text-center">NLAMS</h1>
<p class="font-body-md text-body-md text-emphasis mt-2">National Land Acquisition &amp; Management System</p>
</div>
<!-- Glassmorphic Login Card -->
<div class="glass-card rounded-xl p-8 shadow-lg">
<h2 class="font-headline-md text-headline-md mb-6 text-on-background">Secure Login</h2>
<form action="#" class="space-y-6" method="POST">
<!-- Username / Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase tracking-wider" for="username">Username / Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="solarized-input w-full pl-10 pr-3 py-2 rounded-lg font-body-md text-body-md text-on-surface transition-colors" id="username" name="username" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase tracking-wider flex justify-between" for="password">
<span>Password</span>
<a class="text-primary hover:underline lowercase font-body-sm text-body-sm" href="#">Forgot?</a>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="solarized-input w-full pl-10 pr-3 py-2 rounded-lg font-body-md text-body-md text-on-surface transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Sign In Button -->
<button class="w-full bg-[#268bd2] hover:bg-opacity-90 text-[#fdf6e3] font-body-md text-body-md py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
<!-- Divider -->
<div class="relative flex py-4 items-center">
<div class="flex-grow border-t border-outline-variant opacity-50"></div>
<span class="flex-shrink-0 mx-4 text-outline font-label-caps text-label-caps uppercase">Or</span>
<div class="flex-grow border-t border-outline-variant opacity-50"></div>
</div>
<!-- DSC Login Option -->
<button class="w-full bg-[rgba(238,232,213,0.7)] border border-[#268bd2] text-[#268bd2] hover:bg-surface-container-high font-body-md text-body-md py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[20px]">usb</span>
<span>Login with Digital Signature (DSC)</span>
</button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center flex gap-4 justify-center">
<a class="font-body-sm text-body-sm text-emphasis hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="text-emphasis text-opacity-50">|</span>
<a class="font-body-sm text-body-sm text-emphasis hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
